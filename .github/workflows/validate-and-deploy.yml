name: Validate and deploy Impact Relay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install package and dev tools
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy

  postgres-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: impact
          POSTGRES_PASSWORD: impact
          POSTGRES_DB: impact_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U impact -d impact_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IMPACT_RELAY_DATABASE_URL: postgresql://impact:impact@localhost:5432/impact_relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install package with Postgres driver
        run: pip install -e ".[dev,db]"
      - name: Run durable workflow store suite against Postgres
        shell: bash
        run: |
          set -euo pipefail
          pytest -o addopts='' tests/test_workflow_sql_store.py -v --no-header | tee /tmp/pg.log
      - name: Assert the Postgres SKIP LOCKED test was not skipped
        shell: bash
        run: |
          set -euo pipefail
          grep -q "test_postgres_store_claim_skip_locked PASSED" /tmp/pg.log

  browser-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install browser acceptance dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive accessibility acceptance
        run: npm run test:browser

  ledger-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install package and dev tools
        run: pip install -e ".[dev]"
      - name: Run domain suite
        run: pytest
      # Do not re-run --publish-pages here: it rewrites updatedAt to "today" and
      # fails the stability gate. Operators commit publish output when content changes.
      - name: Assert public artifacts are committed and stable
        run: |
          set -euo pipefail
          # Ensure tracked public aggregates exist and are clean in the tree
          for f in \
            data/use-of-funds-public.json \
            data/impact-digests-public.json \
            data/impact-state.json \
            data/public-evidence.json \
            data/public-impact.json
          do
            test -f "$f"
          done
          git diff --exit-code -- \
            data/use-of-funds-public.json \
            data/impact-digests-public.json \
            data/impact-state.json \
            data/public-evidence.json \
            data/public-impact.json
      - name: Assert public artifacts have no personal residue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              'data/use-of-funds-public.json',
              'data/impact-digests-public.json',
              'data/impact-state.json',
              'data/public-evidence.json',
              'data/public-impact.json',
              'fixtures/agi_phase_c/public_impact.json',
              'fixtures/agi_phase_c/impact_events.json',
              'fixtures/synthetic_v1/public_impact.json',
          ]
          banned = (
              'donor_alice',
              'Alice Patron',
              '"donor_id"',
              'donation_reference',
              'finance.operator',
              '"attendeeNames"',
              '"attendee_names"',
          )
          for path in paths:
              blob = Path(path).read_text(encoding='utf-8')
              for bad in banned:
                  if bad in blob:
                      raise SystemExit(f'forbidden residue in {path}: {bad}')
          print('public artifact privacy ok')
          PY

  platform-conformance:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate platform conformance manifest
        run: |
          set -euo pipefail
          python3 scripts/check_platform_conformance.py

  validate:
    runs-on: ubuntu-latest
    needs:
      - quality
      - ledger-tests
      - postgres-store
      - browser-acceptance
      - platform-conformance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate impact state schema
        run: >-
          npx --yes --package=ajv-cli@5 --package=ajv-formats@3
          ajv validate
          --spec=draft2020
          -c ajv-formats
          -s schemas/impact-state.schema.json
          -d data/impact-state.json
      - name: Validate public use-of-funds schema
        run: >-
          npx --yes --package=ajv-cli@5 --package=ajv-formats@3
          ajv validate
          --spec=draft2020
          -c ajv-formats
          -s schemas/use-of-funds-public.schema.json
          -d data/use-of-funds-public.json
      - name: Validate public digests schema
        run: >-
          npx --yes --package=ajv-cli@5 --package=ajv-formats@3
          ajv validate
          --spec=draft2020
          -c ajv-formats
          -s schemas/impact-digests-public.schema.json
          -d data/impact-digests-public.json
      - name: Validate public evidence schema
        run: >-
          npx --yes --package=ajv-cli@5 --package=ajv-formats@3
          ajv validate
          --spec=draft2020
          -c ajv-formats
          -s schemas/public-evidence.schema.json
          -d data/public-evidence.json
      - name: Validate public impact outcomes schema
        run: >-
          npx --yes --package=ajv-cli@5 --package=ajv-formats@3
          ajv validate
          --spec=draft2020
          -c ajv-formats
          -s schemas/public-impact.schema.json
          -d data/public-impact.json
      - name: Validate Phase C public-impact fixture
        run: >-
          npx --yes --package=ajv-cli@5 --package=ajv-formats@3
          ajv validate
          --spec=draft2020
          -c ajv-formats
          -s schemas/public-impact.schema.json
          -d fixtures/agi_phase_c/public_impact.json
      - name: Validate synthetic v1 public-impact fixture
        run: >-
          npx --yes --package=ajv-cli@5 --package=ajv-formats@3
          ajv validate
          --spec=draft2020
          -c ajv-formats
          -s schemas/public-impact.schema.json
          -d fixtures/synthetic_v1/public_impact.json
      - name: Validate Phase C ImpactEvent fixture
        run: >-
          npx --yes --package=ajv-cli@5 --package=ajv-formats@3
          ajv validate
          --spec=draft2020
          -c ajv-formats
          -s schemas/agi-impact-event.schema.json
          -d fixtures/agi_phase_c/impact_events.json
      - name: Enforce privacy contract flags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          checks = [
              ('data/impact-state.json', ['piiAllowed', 'donorNamesAllowed']),
              ('data/use-of-funds-public.json', ['piiAllowed', 'donorNamesAllowed']),
              ('data/impact-digests-public.json', ['piiAllowed', 'attendeeNamesAllowed']),
              ('data/public-evidence.json', ['piiAllowed', 'donorNamesAllowed']),
              ('data/public-impact.json', ['piiAllowed', 'donorNamesAllowed']),
              ('fixtures/agi_phase_c/public_impact.json', ['piiAllowed', 'donorNamesAllowed']),
              ('fixtures/synthetic_v1/public_impact.json', ['piiAllowed', 'donorNamesAllowed']),
          ]
          for path, keys in checks:
              privacy = json.loads(Path(path).read_text()).get('privacy') or {}
              if privacy.get('classification') != 'public_aggregate_only':
                  raise SystemExit(f'{path}: classification must be public_aggregate_only')
              for key in keys:
                  if privacy.get(key) is not False:
                      raise SystemExit(f'{path}: {key} must be false')
          print('privacy contract ok')
          PY
      - name: Prohibit sensitive export files
        shell: bash
        run: |
          set -euo pipefail
          hits=$(find . -type f \
            \( -iname '*.xlsx' -o -iname '*.csv' -o -iname '*member*registry*' \) \
            -not -path './.git/*' -not -path './.venv/*' -print || true)
          if [[ -n "$hits" ]]; then
            echo "Restricted files detected:"
            echo "$hits"
            exit 1
          fi
      - name: Verify static entry points
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f data/impact-state.json
          test -f data/use-of-funds-public.json
          test -f data/impact-digests-public.json
          test -f data/public-evidence.json
          test -f data/public-impact.json
      - name: Stage Cloudflare public assets
        run: ./scripts/stage_cloudflare_assets.sh
      - name: Verify Cloudflare asset bundle
        run: |
          test -f .cloudflare-assets/impact-relay/index.html
          test -f .cloudflare-assets/impact-relay/app.js
          test -f .cloudflare-assets/impact-relay/data/impact-state.json
          test -f .cloudflare-assets/_headers
          test -f wrangler.toml

  deploy-cloudflare:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping Workers deploy."
            echo "See docs/CLOUDFLARE.md"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage public static assets
        if: steps.creds.outputs.skip != 'true'
        run: ./scripts/stage_cloudflare_assets.sh
      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          packageManager: npm
          command: deploy

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pages is an optional fallback (Cloudflare is the designed public host).
      # Skip cleanly when the repo has no Pages site yet so main stays green
      # until an operator enables Actions-based Pages - same pattern as the
      # Cloudflare credential gate above.
      - name: Check GitHub Pages availability
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages-site.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages" || true)
          if [[ "${code}" != "200" ]]; then
            echo "GitHub Pages is not enabled for this repository (HTTP ${code}); skipping Pages deploy."
            echo "Enable Pages with Source = GitHub Actions to activate this fallback."
            echo "See docs/CLOUDFLARE.md"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          build_type=$(python3 -c "import json; print(json.load(open('/tmp/pages-site.json')).get('build_type') or '')")
          if [[ "${build_type}" != "workflow" ]]; then
            echo "GitHub Pages build_type is '${build_type:-unset}', not 'workflow'; skipping Pages deploy."
            echo "Set Pages Source = GitHub Actions to activate this fallback."
            echo "See docs/CLOUDFLARE.md"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "GitHub Pages site is configured for Actions; proceeding with deploy."
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.pages.outputs.skip != 'true'
      # Repo source keeps /impact-relay/ for Vercel and Cloudflare Workers paths;
      # GH Pages project site lives at /Impact-Relay/ and needs a matching
      # <base href> so relative CSS/JS/data resolve.
      - name: Point static base at GitHub Pages project path
        if: steps.pages.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if ! grep -q 'href="/impact-relay/"' index.html; then
            echo "Expected <base href=\"/impact-relay/\"> in index.html" >&2
            exit 1
          fi
          sed -i 's|href="/impact-relay/"|href="/Impact-Relay/"|g' index.html
          grep -q 'href="/Impact-Relay/"' index.html
          echo "Rewrote base href for GitHub Pages project site."
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: steps.pages.outputs.skip != 'true'
        with:
          path: .
      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
