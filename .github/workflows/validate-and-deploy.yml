name: Validate and deploy Impact Relay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ledger-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and dev tools
        run: pip install -e ".[dev]"
      - name: Run domain suite
        run: pytest
      - name: Refresh public Pages artifacts
        run: |
          set -euo pipefail
          python -m impact_relay --publish-pages
      - name: Assert public artifacts are committed and stable
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            data/use-of-funds-public.json \
            data/impact-digests-public.json \
            data/impact-state.json
      - name: Assert public artifacts have no personal residue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              'data/use-of-funds-public.json',
              'data/impact-digests-public.json',
              'data/impact-state.json',
          ]
          banned = (
              'donor_alice',
              'Alice Patron',
              '"donor_id"',
              'donation_reference',
              'finance.operator',
              '"attendeeNames"',
              '"attendee_names"',
          )
          for path in paths:
              blob = Path(path).read_text(encoding='utf-8')
              for bad in banned:
                  if bad in blob:
                      raise SystemExit(f'forbidden residue in {path}: {bad}')
          print('public artifact privacy ok')
          PY

  validate:
    runs-on: ubuntu-latest
    needs: ledger-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate impact state schema
        run: >-
          npx --yes --package=ajv-cli@5 --package=ajv-formats@3
          ajv validate
          --spec=draft2020
          -c ajv-formats
          -s schemas/impact-state.schema.json
          -d data/impact-state.json
      - name: Validate public use-of-funds schema
        run: >-
          npx --yes --package=ajv-cli@5 --package=ajv-formats@3
          ajv validate
          --spec=draft2020
          -c ajv-formats
          -s schemas/use-of-funds-public.schema.json
          -d data/use-of-funds-public.json
      - name: Validate public digests schema
        run: >-
          npx --yes --package=ajv-cli@5 --package=ajv-formats@3
          ajv validate
          --spec=draft2020
          -c ajv-formats
          -s schemas/impact-digests-public.schema.json
          -d data/impact-digests-public.json
      - name: Enforce privacy contract flags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          checks = [
              ('data/impact-state.json', ['piiAllowed', 'donorNamesAllowed']),
              ('data/use-of-funds-public.json', ['piiAllowed', 'donorNamesAllowed']),
              ('data/impact-digests-public.json', ['piiAllowed', 'attendeeNamesAllowed']),
          ]
          for path, keys in checks:
              privacy = json.loads(Path(path).read_text()).get('privacy') or {}
              if privacy.get('classification') != 'public_aggregate_only':
                  raise SystemExit(f'{path}: classification must be public_aggregate_only')
              for key in keys:
                  if privacy.get(key) is not False:
                      raise SystemExit(f'{path}: {key} must be false')
          print('privacy contract ok')
          PY
      - name: Prohibit sensitive export files
        shell: bash
        run: |
          set -euo pipefail
          hits=$(find . -type f \
            \( -iname '*.xlsx' -o -iname '*.csv' -o -iname '*member*registry*' \) \
            -not -path './.git/*' -not -path './.venv/*' -print || true)
          if [[ -n "$hits" ]]; then
            echo "Restricted files detected:"
            echo "$hits"
            exit 1
          fi
      - name: Verify static entry points
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f data/impact-state.json
          test -f data/use-of-funds-public.json
          test -f data/impact-digests-public.json

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
