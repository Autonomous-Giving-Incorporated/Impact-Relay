# Optional Postgres for durable pilot (P2).
# Default durable path uses SQLite — you do not need this for local demos.
#
#   docker compose -f docker-compose.postgres.yml up -d
#   export IMPACT_RELAY_DATABASE_URL=postgresql://impact:impact@localhost:5432/impact_relay
#   pip install 'impact-relay[db]'
#   python -m impact_relay --durable seed

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: impact
      POSTGRES_PASSWORD: impact
      POSTGRES_DB: impact_relay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impact -d impact_relay"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - impact_relay_pg:/var/lib/postgresql/data

volumes:
  impact_relay_pg:
